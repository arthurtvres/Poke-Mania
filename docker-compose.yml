services:
  postgres:
    image: postgres:16-alpine
    container_name: pokemania-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: pokemania
      POSTGRES_USER: pokemania
      POSTGRES_PASSWORD: pokemania
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - pokemania-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pokemania -d pokemania"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pokemania-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/pokemania
      DB_USER: pokemania
      DB_PASSWORD: pokemania
      SPRING_PROFILES_ACTIVE: docker
      TZ: UTC
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/v1/pokemons?size=1 >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Browser-side URL — precisa apontar para o host, não para o nome do container
        VITE_API_BASE_URL: http://localhost:8080/api/v1
    container_name: pokemania-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

  adminer:
    image: adminer:latest
    container_name: pokemania-adminer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres

volumes:
  pokemania-data:
    name: pokemania-data
